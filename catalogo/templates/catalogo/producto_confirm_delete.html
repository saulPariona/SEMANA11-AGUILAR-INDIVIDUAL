{% extends "catalogo/base.html" %}

{% block title %}Eliminar producto | Catálogo{% endblock %}
{% block page_title %}Eliminar producto{% endblock %}

{% block content %}
<section class="form-card confirm-card">
    <h2>¿Eliminar "{{ object.nombre }}"?</h2>
    <p>Esta acción no se puede deshacer.</p>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <a class="button button-ghost" href="{% url 'catalogo:catalogo' %}">Cancelar</a>
        <button class="button button-danger" type="submit">Sí, eliminar</button>
    </form>
</section>
{% endblock %}
